<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Adoption Application - Ritesh's Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-amber-50/60 text-slate-800 min-h-screen flex flex-col justify-between">

    <header class="bg-amber-600 text-white shadow-md py-6 px-4">
        <div class="max-w-xl mx-auto text-center">
            <h1 class="text-3xl font-bold tracking-tight">🐶 Dog Adoption Application</h1>
            <p class="mt-2 text-amber-100 text-sm">Help Ritesh find and adopt his new furry best friend!</p>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 py-10 flex-grow w-full">
        <section class="bg-white rounded-2xl shadow-xl p-8 border border-amber-100">
            <h2 class="text-xl font-semibold text-amber-900 mb-6 border-b pb-3">
                Adoption Application Form
            </h2>

            <form action="#" method="POST" class="space-y-6">
                
                <!-- Name Field -->
                <div>
                    <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required
                           class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                </div>

                <!-- Phone Number Field -->
                <div>
                    <label for="phone" class="block text-sm font-medium text-slate-700 mb-1">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="Phone Number" required
                           class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                </div>

                <!-- Address Field -->
                <div>
                    <label for="address" class="block text-sm font-medium text-slate-700 mb-1">Address</label>
                    <input type="text" id="address" name="address" placeholder="Address" required
                           class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition">
                </div>

                <!-- Checkbox Field -->
                <div class="flex items-center space-x-3 pt-2">
                    <input type="checkbox" id="checkbox" name="has_lived_with_dog" value="Have you ever lived with a Dog before?"
                           class="w-5 h-5 text-amber-600 border-slate-300 rounded focus:ring-amber-500">
                    <label for="checkbox" class="text-sm font-medium text-slate-700">
                        Have you ever lived with a Dog before?
                    </label>
                </div>

                <!-- Multi-select Breed Field -->
                <div>
                    <label for="multiSelect" class="block text-sm font-medium text-slate-700 mb-1">Please select your preferred breeds</label>
                    <select id="multiSelect" name="preferred_breeds" multiple required
                            class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-amber-500 focus:border-amber-500 outline-none transition h-32 bg-white">
                        <option value="Golden Retriever">Golden Retriever</option>
                        <option value="Poodle">Poodle</option>
                        <option value="German Shepherd">German Shepherd</option>
                        <option value="Labrador Retriever">Labrador Retriever</option>
                        <option value="Beagle">Beagle</option>
                    </select>
                    <p class="text-xs text-slate-500 mt-1">Hold Ctrl (Windows) or Command (Mac) to select multiple options.</p>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <input type="submit" id="submit" value="Submit"
                           class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 px-6 rounded-lg shadow-md transition cursor-pointer">
                </div>

            </form>
        </section>
    </main>

    <footer class="bg-slate-800 text-slate-300 py-6 px-4 text-center text-sm">
        <p>Prepared for Ritesh • Dog Adoption Portal 🐾</p>
    </footer>

</body>
</html>
